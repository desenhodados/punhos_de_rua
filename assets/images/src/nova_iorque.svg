<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <!-- Lutador urbano dos EUA: Jack, entrada do metro de Nova Iorque, noite -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0a26"/>
      <stop offset=".55" stop-color="#3a1f5c"/>
      <stop offset="1" stop-color="#d0607a"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2638"/>
      <stop offset="1" stop-color="#0d0c14"/>
    </linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d4f86"/>
      <stop offset=".5" stop-color="#4a73b5"/>
      <stop offset="1" stop-color="#253f6e"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3542"/>
      <stop offset=".45" stop-color="#1d1a22"/>
      <stop offset="1" stop-color="#0d0b10"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".5" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#b8862a"/>
    </linearGradient>
    <radialGradient id="globe" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e9ffe9"/>
      <stop offset=".35" stop-color="#5fe08a"/>
      <stop offset="1" stop-color="#5fe08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <!-- estrelas -->
  <g fill="#fff" opacity=".7">
    <circle cx="60" cy="40" r="1.2"/><circle cx="210" cy="70" r="1"/><circle cx="350" cy="30" r="1.4"/>
    <circle cx="610" cy="55" r="1"/><circle cx="760" cy="25" r="1.3"/><circle cx="900" cy="80" r="1"/>
  </g>

  <!-- arranha-céus ao longe -->
  <g fill="#1d1640">
    <rect x="0" y="150" width="70" height="250"/>
    <rect x="80" y="90" width="55" height="310"/>
    <polygon points="160,400 160,60 185,30 210,60 210,400"/>
    <rect x="196" y="10" width="4" height="25"/>
    <rect x="230" y="130" width="80" height="270"/>
    <rect x="640" y="110" width="70" height="290"/>
    <rect x="720" y="40" width="60" height="360"/>
    <polygon points="735,40 750,0 765,40"/>
    <rect x="800" y="140" width="90" height="260"/>
    <rect x="895" y="100" width="65" height="300"/>
  </g>
  <g fill="#ffd27a" opacity=".55">
    <rect x="90" y="110" width="6" height="8"/><rect x="110" y="140" width="6" height="8"/><rect x="90" y="200" width="6" height="8"/>
    <rect x="170" y="100" width="5" height="7"/><rect x="190" y="150" width="5" height="7"/><rect x="170" y="220" width="5" height="7"/>
    <rect x="245" y="150" width="7" height="8"/><rect x="280" y="190" width="7" height="8"/><rect x="730" y="80" width="6" height="8"/>
    <rect x="755" y="130" width="6" height="8"/><rect x="730" y="210" width="6" height="8"/><rect x="820" y="170" width="7" height="8"/>
    <rect x="860" y="220" width="7" height="8"/><rect x="910" y="130" width="6" height="8"/><rect x="655" y="150" width="6" height="8"/>
  </g>

  <!-- prédios de tijolo à frente, com caixa de água e escadas de incêndio -->
  <g>
    <rect x="0" y="200" width="300" height="230" fill="#4a2230"/>
    <rect x="620" y="180" width="340" height="250" fill="#43202e"/>
    <!-- caixa de água -->
    <g fill="#24121c">
      <rect x="60" y="150" width="46" height="44" rx="4"/>
      <polygon points="56,152 83,128 110,152"/>
      <rect x="64" y="194" width="4" height="8"/><rect x="98" y="194" width="4" height="8"/>
      <rect x="800" y="128" width="50" height="46" rx="4"/>
      <polygon points="796,130 825,104 854,130"/>
      <rect x="806" y="174" width="4" height="8"/><rect x="840" y="174" width="4" height="8"/>
    </g>
    <!-- janelas -->
    <g fill="#1a0c14">
      <rect x="20" y="230" width="34" height="44"/><rect x="80" y="230" width="34" height="44"/><rect x="140" y="230" width="34" height="44"/><rect x="200" y="230" width="34" height="44"/>
      <rect x="20" y="300" width="34" height="44"/><rect x="200" y="300" width="34" height="44"/>
      <rect x="650" y="210" width="34" height="44"/><rect x="710" y="210" width="34" height="44"/><rect x="830" y="210" width="34" height="44"/><rect x="890" y="210" width="34" height="44"/>
      <rect x="650" y="280" width="34" height="44"/><rect x="890" y="280" width="34" height="44"/>
    </g>
    <g fill="#ffcf7a">
      <rect x="80" y="300" width="34" height="44"/><rect x="140" y="300" width="34" height="44"/>
      <rect x="770" y="210" width="34" height="44"/><rect x="710" y="280" width="34" height="44"/><rect x="830" y="280" width="34" height="44"/>
    </g>
    <!-- escada de incêndio -->
    <g stroke="#120a10" stroke-width="3" fill="none">
      <path d="M70 286 H190 M70 356 H190 M70 286 V300 M190 286 V300 M70 356 V370 M190 356 V370"/>
      <path d="M80 290 L180 352" stroke-width="2"/>
      <path d="M760 266 H880 M760 336 H880 M770 270 L870 332" stroke-width="2.5"/>
    </g>
  </g>

  <!-- passeio e rua -->
  <rect x="0" y="420" width="960" height="120" fill="url(#street)"/>
  <rect x="0" y="418" width="960" height="6" fill="#6a6680"/>
  <!-- reflexos molhados -->
  <g opacity=".35">
    <rect x="80" y="440" width="30" height="80" fill="#ffcf7a" filter="url(#blur)"/>
    <rect x="800" y="440" width="30" height="80" fill="#ffcf7a" filter="url(#blur)"/>
    <rect x="300" y="440" width="24" height="70" fill="#5fe08a" filter="url(#blur)"/>
    <rect x="640" y="440" width="24" height="70" fill="#5fe08a" filter="url(#blur)"/>
  </g>

  <!-- táxi amarelo à direita -->
  <g transform="translate(760,392)">
    <path d="M0 60 V34 Q0 26 10 24 L40 22 L62 0 H140 L168 22 L200 26 V60 Z" fill="#f2b705" stroke="#120c18" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 6 H100 V22 H52 Z M106 6 H136 L156 22 H106 Z" fill="#3a5a7a"/>
    <rect x="86" y="-10" width="30" height="10" fill="#fff4c8" stroke="#120c18" stroke-width="3"/>
    <rect x="0" y="40" width="200" height="6" fill="#120c18" opacity=".6"/>
    <circle cx="44" cy="62" r="18" fill="#141218" stroke="#3a3644" stroke-width="5"/>
    <circle cx="160" cy="62" r="18" fill="#141218" stroke="#3a3644" stroke-width="5"/>
  </g>

  <!-- entrada do metro: grades verdes, escadas, candeeiros de globo -->
  <g>
    <polygon points="180,430 420,430 400,470 200,470" fill="#0c0a10"/>
    <g stroke="#3a3446" stroke-width="3">
      <line x1="196" y1="440" x2="404" y2="440"/><line x1="200" y1="452" x2="400" y2="452"/><line x1="204" y1="464" x2="396" y2="464"/>
    </g>
    <g stroke="#1f6b45" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M170 432 V340 H430 V432"/>
      <path d="M170 372 H430"/>
    </g>
    <g stroke="#1f6b45" stroke-width="3">
      <line x1="200" y1="340" x2="200" y2="432"/><line x1="230" y1="340" x2="230" y2="432"/><line x1="260" y1="340" x2="260" y2="432"/>
      <line x1="340" y1="340" x2="340" y2="432"/><line x1="370" y1="340" x2="370" y2="432"/><line x1="400" y1="340" x2="400" y2="432"/>
    </g>
    <rect x="236" y="300" width="128" height="30" fill="#111" stroke="#e8e8e8" stroke-width="2"/>
    <text x="300" y="322" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="#fff" text-anchor="middle">SUBWAY</text>
    <!-- postes com globo -->
    <g>
      <rect x="166" y="290" width="8" height="52" fill="#1f6b45"/>
      <rect x="426" y="290" width="8" height="52" fill="#1f6b45"/>
      <circle cx="170" cy="282" r="40" fill="url(#globe)" opacity=".7"/>
      <circle cx="430" cy="282" r="40" fill="url(#globe)" opacity=".7"/>
      <circle cx="170" cy="282" r="12" fill="#b8ffcf" stroke="#1f6b45" stroke-width="3"/>
      <circle cx="430" cy="282" r="12" fill="#b8ffcf" stroke="#1f6b45" stroke-width="3"/>
    </g>
  </g>

  <!-- vapor do bueiro -->
  <g fill="#fff" filter="url(#blur)" opacity=".28">
    <ellipse cx="600" cy="430" rx="40" ry="18"/>
    <ellipse cx="590" cy="390" rx="34" ry="26"/>
    <ellipse cx="610" cy="340" rx="30" ry="30"/>
    <ellipse cx="595" cy="290" rx="22" ry="26"/>
  </g>
  <ellipse cx="600" cy="440" rx="34" ry="8" fill="#141218" stroke="#3a3644" stroke-width="3"/>

  <!-- ===== JACK ===== -->
  <g transform="translate(140,0)">
  <ellipse cx="480" cy="512" rx="110" ry="14" fill="#000" opacity=".5"/>
  <g stroke="#120c18" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- pernas (calças de ganga) -->
    <path d="M430 330 L486 330 L470 420 L452 490 L414 490 L420 410 Z" fill="url(#jeans)"/>
    <path d="M476 330 L534 330 L548 410 L556 490 L518 490 L500 420 Z" fill="url(#jeans)"/>
    <path d="M440 380 L452 470 M520 380 L536 470" stroke="#7ea4e0" stroke-width="2" fill="none"/>
    <!-- ténis -->
    <path d="M410 486 L456 486 L462 506 L394 508 Q392 494 410 486 Z" fill="#f4f2f8"/>
    <path d="M516 486 L560 486 Q574 494 572 508 L512 506 Z" fill="#f4f2f8"/>
    <path d="M396 502 L462 502 M514 502 L572 502" stroke="#c0392b" stroke-width="4"/>
    <!-- cinto -->
    <rect x="428" y="322" width="108" height="16" fill="#5a3a1e"/>
    <rect x="470" y="320" width="24" height="20" fill="#d9c27a"/>
    <!-- t-shirt branca -->
    <path d="M452 206 L508 206 L516 324 L446 324 Z" fill="#f4f2f8"/>
    <path d="M466 206 Q480 226 494 206" fill="#e4a576"/>
    <!-- chapa militar -->
    <path d="M468 214 L480 250 L492 214" fill="none" stroke="#9aa3ad" stroke-width="2"/>
    <rect x="474" y="248" width="12" height="16" rx="2" fill="#c8d0d8" stroke-width="2"/>
    <!-- casaco de cabedal (lado esquerdo) -->
    <path d="M452 202 L404 214 Q374 222 372 250 L382 340 L448 342 L456 280 Z" fill="url(#leather)"/>
    <!-- lado direito -->
    <path d="M508 202 L556 214 Q586 222 588 250 L578 340 L512 342 L504 280 Z" fill="url(#leather)"/>
    <!-- golas -->
    <path d="M452 202 L432 214 L450 262 L460 232 Z" fill="#2c2732"/>
    <path d="M508 202 L528 214 L510 262 L500 232 Z" fill="#2c2732"/>
    <!-- fecho e bolsos -->
    <path d="M450 270 V336 M510 270 V336" stroke="#a8a8b8" stroke-width="2"/>
    <path d="M398 290 L432 286 M528 286 L562 290" stroke="#a8a8b8" stroke-width="2.5"/>
    <!-- braços (mangas) -->
    <path d="M404 214 Q366 220 358 262 L344 340 L378 344 L390 270 Z" fill="url(#leather)"/>
    <path d="M556 214 Q594 220 602 262 L618 340 L584 344 L572 270 Z" fill="url(#leather)"/>
    <path d="M346 324 L378 328 M584 328 L616 324" stroke="#a8a8b8" stroke-width="3"/>
    <!-- punhos -->
    <path d="M342 340 Q336 372 356 380 Q380 382 382 360 L380 342 Z" fill="#e4a576"/>
    <path d="M346 354 H378 M348 366 H378" stroke-width="2.5" fill="none"/>
    <path d="M618 340 Q624 372 604 380 Q580 382 578 360 L580 342 Z" fill="#e4a576"/>
    <path d="M614 354 H582 M612 366 H582" stroke-width="2.5" fill="none"/>
    <!-- pescoço -->
    <path d="M466 176 L494 176 L496 208 Q480 216 464 208 Z" fill="#d48f62"/>
    <!-- cabeça -->
    <path d="M448 140 Q446 104 480 100 Q514 104 512 140 L510 168 Q506 190 480 194 Q454 190 450 168 Z" fill="#e4a576"/>
    <!-- orelhas -->
    <path d="M450 140 Q438 138 440 154 Q442 166 452 166" fill="#d48f62"/>
    <path d="M510 140 Q522 138 520 154 Q518 166 508 166" fill="#d48f62"/>
    <!-- cabelo loiro estilo anos 80 (com franja e nuca comprida) -->
    <path d="M444 150 Q432 96 470 80 Q500 70 522 92 Q536 110 518 150 L512 128 Q500 116 486 122 Q470 112 458 124 Q450 134 450 152 Z" fill="url(#hair)"/>
    <path d="M444 150 Q440 180 452 196 L446 170 Z M518 150 Q522 180 510 196 L514 170 Z" fill="#d9a83a"/>
    <path d="M462 92 Q478 86 500 92 M470 102 Q488 96 506 104" stroke="#fff6c8" stroke-width="2.5" fill="none"/>
  </g>
  <!-- rosto -->
  <g stroke="#120c18" stroke-linecap="round" fill="none">
    <path d="M458 140 L474 144 M486 144 L502 140" stroke-width="4"/>
    <path d="M462 152 Q467 149 472 152 M488 152 Q493 149 498 152" stroke-width="3"/>
    <circle cx="467" cy="153" r="1.8" fill="#2a5a8a" stroke="none"/>
    <circle cx="493" cy="153" r="1.8" fill="#2a5a8a" stroke="none"/>
    <path d="M480 152 L476 168 L484 168" stroke-width="2.5" stroke="#9a5a3a"/>
    <path d="M468 180 Q482 184 494 177" stroke-width="3"/>
  </g>
  <path d="M452 166 Q456 188 480 194 Q504 188 508 166 Q500 184 480 186 Q460 184 452 166 Z" fill="#b07858" opacity=".45"/>

  </g>
</svg>
