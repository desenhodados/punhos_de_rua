<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <!-- Heroína de ação ocidental: Rita, cidade europeia à noite (calçada, candeeiros a gás, rio e ponte) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a1e"/>
      <stop offset=".6" stop-color="#14285a"/>
      <stop offset="1" stop-color="#3f6aa8"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3260"/>
      <stop offset="1" stop-color="#0a1430"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4658"/>
      <stop offset="1" stop-color="#16141e"/>
    </linearGradient>
    <linearGradient id="bomber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d8a4a"/>
      <stop offset=".5" stop-color="#55602e"/>
      <stop offset="1" stop-color="#363e1c"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a24"/>
      <stop offset=".5" stop-color="#34344a"/>
      <stop offset="1" stop-color="#15151e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c0522a"/>
      <stop offset="1" stop-color="#6e2412"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2c0"/>
      <stop offset=".3" stop-color="#ffbf5a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="800" cy="80" r="70" fill="#fff6d8" opacity=".12"/>
  <circle cx="800" cy="80" r="26" fill="#fff6d8"/>
  <g fill="#fff" opacity=".7">
    <circle cx="80" cy="50" r="1.2"/><circle cx="260" cy="30" r="1"/><circle cx="420" cy="70" r="1.3"/><circle cx="600" cy="40" r="1"/><circle cx="700" cy="120" r="1"/>
  </g>

  <!-- silhueta da cidade velha: cúpula, torre da igreja, telhados -->
  <g fill="#22336a">
    <rect x="0" y="210" width="960" height="90"/>
    <path d="M120 210 V150 Q160 90 200 150 V210 Z"/>
    <rect x="156" y="78" width="8" height="24"/>
    <path d="M520 210 V110 L540 60 L560 110 V210 Z"/>
    <path d="M300 210 L330 180 L360 210 M380 210 L420 170 L460 210 M620 210 L650 185 L690 210 M720 210 L760 160 L800 210 M850 210 L890 180 L930 210"/>
  </g>
  <g fill="#ffcf7a" opacity=".6">
    <rect x="530" y="120" width="6" height="10"/><rect x="544" y="140" width="6" height="10"/>
    <rect x="320" y="220" width="5" height="7"/><rect x="420" y="230" width="5" height="7"/><rect x="760" y="220" width="5" height="7"/><rect x="880" y="235" width="5" height="7"/>
  </g>

  <!-- ponte de pedra em arcos sobre o rio -->
  <rect x="0" y="290" width="960" height="90" fill="url(#river)"/>
  <g fill="#2c3c70">
    <path d="M0 270 H960 V300 H0 Z"/>
    <path d="M0 300 H960 V340 Q900 300 840 340 Q780 300 720 340 Q660 300 600 340 Q540 300 480 340 Q420 300 360 340 Q300 300 240 340 Q180 300 120 340 Q60 300 0 340 Z"/>
  </g>
  <g fill="#ffcf7a" opacity=".5" filter="url(#blur)">
    <rect x="160" y="320" width="14" height="50"/><rect x="420" y="320" width="14" height="50"/><rect x="760" y="320" width="14" height="50"/>
  </g>
  <g fill="#ffe2a0">
    <circle cx="60" cy="262" r="4"/><circle cx="240" cy="262" r="4"/><circle cx="420" cy="262" r="4"/><circle cx="600" cy="262" r="4"/><circle cx="780" cy="262" r="4"/><circle cx="930" cy="262" r="4"/>
  </g>

  <!-- prédios antigos em primeiro plano (varandas, persianas) -->
  <g>
    <path d="M0 120 L40 90 L120 90 L160 120 V400 H0 Z" fill="#3a2a36"/>
    <path d="M800 110 L840 80 L920 80 L960 110 V400 H800 Z" fill="#33283a"/>
    <g fill="#1c1420">
      <rect x="20" y="140" width="34" height="56" rx="16"/><rect x="96" y="140" width="34" height="56" rx="16"/>
      <rect x="830" y="130" width="34" height="56" rx="16"/><rect x="900" y="130" width="34" height="56" rx="16"/>
    </g>
    <g fill="#ffcf7a">
      <rect x="20" y="230" width="34" height="56" rx="16"/><rect x="900" y="230" width="34" height="56" rx="16"/>
    </g>
    <g fill="#1c1420">
      <rect x="96" y="230" width="34" height="56" rx="16"/><rect x="830" y="230" width="34" height="56" rx="16"/>
    </g>
    <g stroke="#0c0810" stroke-width="3" fill="none">
      <path d="M12 290 H64 M12 290 V306 H64 V290 M20 290 V306 M30 290 V306 M40 290 V306 M50 290 V306"/>
      <path d="M892 290 H944 M892 290 V306 H944 V290 M902 290 V306 M912 290 V306 M922 290 V306 M932 290 V306"/>
    </g>
  </g>

  <!-- calçada de pedra -->
  <rect x="0" y="380" width="960" height="160" fill="url(#stone)"/>
  <g stroke="#0e0c14" stroke-width="2" opacity=".55" fill="none">
    <path d="M0 400 Q480 392 960 400 M0 424 Q480 414 960 424 M0 452 Q480 440 960 452 M0 486 Q480 470 960 486 M0 524 Q480 506 960 524"/>
    <path d="M40 380 L30 540 M120 380 L104 540 M200 380 L180 540 M280 380 L258 540 M360 380 L336 540 M440 380 L420 540 M520 380 L520 540 M600 380 L620 540 M680 380 L702 540 M760 380 L784 540 M840 380 L866 540 M920 380 L948 540"/>
  </g>
  <rect x="0" y="376" width="960" height="6" fill="#6e6a7e"/>

  <!-- candeeiros a gás -->
  <g>
    <circle cx="250" cy="250" r="90" fill="url(#lamp)"/>
    <circle cx="720" cy="250" r="90" fill="url(#lamp)"/>
    <g fill="#14101a">
      <rect x="246" y="262" width="8" height="130"/><rect x="238" y="388" width="24" height="10"/>
      <path d="M234 240 H266 L260 266 H240 Z"/><path d="M230 240 L250 224 L270 240 Z"/>
      <rect x="716" y="262" width="8" height="130"/><rect x="708" y="388" width="24" height="10"/>
      <path d="M704 240 H736 L730 266 H710 Z"/><path d="M700 240 L720 224 L740 240 Z"/>
    </g>
    <rect x="242" y="244" width="16" height="18" fill="#ffe8a8"/>
    <rect x="712" y="244" width="16" height="18" fill="#ffe8a8"/>
    <ellipse cx="250" cy="430" rx="80" ry="18" fill="#ffbf5a" opacity=".22" filter="url(#blur)"/>
    <ellipse cx="720" cy="430" rx="80" ry="18" fill="#ffbf5a" opacity=".22" filter="url(#blur)"/>
  </g>

  <!-- ===== RITA ===== -->
  <ellipse cx="480" cy="514" rx="90" ry="12" fill="#000" opacity=".5"/>
  <g stroke="#120c18" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- rabo de cavalo (atrás) -->
    <path d="M510 112 Q560 104 572 140 Q586 190 556 236 Q570 190 548 156 Q534 138 512 140 Z" fill="url(#hair)"/>
    <!-- pernas -->
    <path d="M444 330 L482 330 L476 420 L466 486 L436 486 L440 410 Z" fill="url(#pants)"/>
    <path d="M480 330 L518 330 L530 410 L540 486 L510 486 L494 420 Z" fill="url(#pants)"/>
    <!-- botas -->
    <path d="M434 446 L470 446 L470 490 L478 508 L420 508 Q418 492 434 486 Z" fill="#3a2418"/>
    <path d="M506 446 L542 446 L540 486 Q558 492 556 508 L500 508 L506 490 Z" fill="#3a2418"/>
    <path d="M420 502 H478 M500 502 H556" stroke="#120c18" stroke-width="5"/>
    <!-- top -->
    <path d="M462 208 L498 208 L506 300 L454 300 Z" fill="#c0392b"/>
    <path d="M468 208 Q480 224 492 208" fill="#f0c4a0"/>
    <!-- bomber: corpo e cós canelado -->
    <path d="M462 204 L426 216 Q404 226 404 250 L414 318 L452 320 L460 270 Z" fill="url(#bomber)"/>
    <path d="M498 204 L534 216 Q556 226 556 250 L546 318 L508 320 L500 270 Z" fill="url(#bomber)"/>
    <path d="M414 314 L456 316 L456 336 L416 334 Z M504 316 L546 314 L544 334 L504 336 Z" fill="#2b2b2b"/>
    <path d="M420 320 V332 M430 320 V334 M440 320 V334 M450 320 V334 M510 320 V334 M520 320 V334 M530 320 V334 M540 320 V332" stroke="#4a4a4a" stroke-width="2"/>
    <!-- forro laranja visível e gola -->
    <path d="M462 204 L452 214 L458 300 L462 270 Z M498 204 L508 214 L502 300 L498 270 Z" fill="#f08a24"/>
    <path d="M456 200 Q480 214 504 200 L500 192 Q480 204 460 192 Z" fill="#2b2b2b"/>
    <!-- remendo no ombro e bolso de manga -->
    <circle cx="424" cy="246" r="9" fill="#c0392b" stroke-width="2.5"/>
    <circle cx="424" cy="246" r="4" fill="#f4f2f8" stroke="none"/>
    <!-- mangas -->
    <path d="M426 216 Q396 222 390 262 L378 324 L408 330 L420 268 Z" fill="url(#bomber)"/>
    <path d="M534 216 Q564 222 570 262 L582 324 L552 330 L540 268 Z" fill="url(#bomber)"/>
    <path d="M376 318 L408 324 L406 342 L374 336 Z M552 324 L584 318 L586 336 L554 342 Z" fill="#2b2b2b"/>
    <!-- mãos: uma em punho levantada à frente do peito? mãos em guarda -->
    <path d="M374 336 Q366 366 384 372 Q404 374 406 352 L406 342 Z" fill="#f0c4a0"/>
    <path d="M378 352 H404 M378 362 H402" stroke-width="2" fill="none"/>
    <path d="M586 336 Q594 366 576 372 Q556 374 554 352 L554 342 Z" fill="#f0c4a0"/>
    <path d="M582 352 H556 M582 362 H558" stroke-width="2" fill="none"/>
    <!-- pescoço -->
    <path d="M470 178 L490 178 L492 202 Q480 208 468 202 Z" fill="#e0aa86"/>
    <!-- cabeça -->
    <path d="M452 136 Q450 102 480 100 Q510 102 508 136 L506 160 Q502 186 480 190 Q458 186 454 160 Z" fill="#f0c4a0"/>
    <path d="M454 138 Q444 138 446 152 Q448 162 456 162 M506 138 Q516 138 514 152 Q512 162 504 162" fill="#e0aa86"/>
    <!-- cabelo puxado com franja lateral -->
    <path d="M448 140 Q440 92 482 86 Q522 88 514 132 Q506 112 488 110 Q476 126 452 140 Z" fill="url(#hair)"/>
    <path d="M500 104 Q514 102 514 116" stroke="#e07a48" stroke-width="2.5" fill="none"/>
    <!-- elástico do rabo de cavalo -->
    <rect x="508" y="108" width="12" height="16" rx="3" fill="#f08a24" transform="rotate(20 514 116)"/>
    <!-- brincos -->
    <circle cx="454" cy="166" r="3" fill="#ffd966" stroke-width="1.5"/>
  </g>
  <g stroke="#120c18" stroke-linecap="round" fill="none">
    <path d="M462 136 L474 139 M486 139 L498 136" stroke-width="3"/>
    <path d="M462 148 Q468 143 474 148 M486 148 Q492 143 498 148" stroke-width="3"/>
    <circle cx="468" cy="149" r="2" fill="#3a7a4a" stroke="none"/>
    <circle cx="492" cy="149" r="2" fill="#3a7a4a" stroke="none"/>
    <path d="M480 150 L477 164 L483 164" stroke-width="2" stroke="#a86a4a"/>
  </g>
  <path d="M470 174 Q480 178 490 173 Q482 182 470 174 Z" fill="#b8323a"/>
  <circle cx="463" cy="162" r="5" fill="#e88a8a" opacity=".35"/>
  <circle cx="497" cy="162" r="5" fill="#e88a8a" opacity=".35"/>
</svg>
